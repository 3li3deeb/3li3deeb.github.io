<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>عراق دوت | تفاصيل الخبر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{ --ink:#111214; --paper:#f7f6f2; --card:#ffffff; --border:#e6e3da; --text-dim:#6a6a63; --gold:#b8863b; --breaking:#c0392b; }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Tajawal',sans-serif;}
  h1,h2,.brand{font-family:'IBM Plex Sans Arabic',sans-serif;}
  a{color:inherit;text-decoration:none;}
  img{max-width:100%;display:block;}

  header.site-header{background:var(--ink);color:#fff;padding:18px 24px;}
  .header-inner{max-width:760px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;}
  .brand{font-size:22px;font-weight:700;color:var(--gold);}
  .back-link{font-size:13px;color:#9a9a94;}
  .back-link:hover{color:#fff;}

  main{max-width:760px;margin:0 auto;padding:32px 24px 60px;}
  .cat-pill{display:inline-block;font-size:12px;background:rgba(184,134,59,.12);color:var(--gold);padding:3px 12px;border-radius:20px;margin-bottom:14px;font-weight:600;}
  .breaking-pill{background:rgba(192,57,43,.12);color:var(--breaking);}
  article h1{font-size:26px;line-height:1.5;margin:0 0 12px;}
  .meta{font-size:13px;color:var(--text-dim);margin-bottom:20px;display:flex;gap:16px;flex-wrap:wrap;}
  .cover{width:100%;border-radius:12px;margin-bottom:24px;aspect-ratio:16/9;object-fit:cover;background:var(--border);}
  .content{font-size:16px;line-height:2;white-space:pre-wrap;}
  .not-found{text-align:center;padding:80px 20px;color:var(--text-dim);}
  footer{background:var(--ink);color:#8a8a84;text-align:center;padding:24px;font-size:13px;margin-top:40px;}
</style>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a class="brand" href="index.html">عراق دوت | IRAQdot</a>
    <a class="back-link" href="index.html">→ الرجوع للرئيسية</a>
  </div>
</header>

<main id="main-content">
  <div class="not-found">جارِ التحميل...</div>
</main>

<footer>© <span id="year"></span> عراق دوت — جميع الحقوق محفوظة</footer>

<script>
const SUPABASE_URL = "https://curjpcwsfembsvlcdmyd.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_tCD65z3J7z_g_vzp8B-pSA_rROB0OXg";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

document.getElementById("year").textContent = new Date().getFullYear();

const params = new URLSearchParams(location.search);
const id = params.get("id");

async function loadArticle() {
  const main = document.getElementById("main-content");
  if (!id) { main.innerHTML = '<div class="not-found">لم يتم تحديد الخبر.</div>'; return; }

  const { data, error } = await sb.from("news").select("*").eq("id", id).single();
  if (error || !data) { main.innerHTML = '<div class="not-found">تعذّر العثور على هذا الخبر.</div>'; return; }

  document.title = data.title + " | عراق دوت";
  const dateStr = new Date(data.published_at).toLocaleDateString("ar-IQ", { year: "numeric", month: "long", day: "numeric" });

  main.innerHTML = `
    <article>
      <span class="cat-pill ${data.is_breaking ? "breaking-pill" : ""}">${data.is_breaking ? "عاجل" : data.category}</span>
      <h1>${data.title}</h1>
      <div class="meta">
        ${data.author ? `<span>${data.author}</span>` : ""}
        <span>${dateStr}</span>
      </div>
      ${data.image_url ? `<img class="cover" src="${data.image_url}" alt="${data.title}">` : ""}
      <div class="content">${data.body}</div>
    </article>`;
}

loadArticle();
</script>
</body>
</html>
