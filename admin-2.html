<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة تحكم عراق دوت</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#14161a;
    --surface:#1c1f25;
    --surface-2:#22262d;
    --border:#2b2f37;
    --text:#f2f1ec;
    --text-dim:#9aa0ab;
    --gold:#d4a24e;
    --gold-dim:#8a6d34;
    --danger:#e5484d;
    --success:#4caf80;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Tajawal',sans-serif;min-height:100vh;}
  h1,h2,h3,.brand,.btn,label,.badge{font-family:'IBM Plex Sans Arabic',sans-serif;}

  /* ---------- Login ---------- */
  #login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .login-card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:32px 28px;text-align:center;}
  .login-card .brand{font-size:26px;font-weight:700;color:var(--gold);margin-bottom:2px;}
  .login-card .brand-sub{color:var(--text-dim);font-size:13px;margin-bottom:28px;}
  .field{text-align:right;margin-bottom:14px;}
  .field label{display:block;font-size:13px;color:var(--text-dim);margin-bottom:6px;}
  input[type=text],input[type=email],input[type=password],input[type=datetime-local],select,textarea{
    width:100%;background:var(--surface-2);border:1px solid var(--border);color:var(--text);
    border-radius:8px;padding:11px 12px;font-family:'Tajawal',sans-serif;font-size:14px;outline:none;
    transition:border-color .15s;
  }
  input:focus,select:focus,textarea:focus{border-color:var(--gold);}
  .btn{border:none;border-radius:8px;padding:11px 18px;font-size:14px;font-weight:600;cursor:pointer;transition:opacity .15s,transform .1s;}
  .btn:active{transform:scale(.98);}
  .btn-gold{background:var(--gold);color:#1a1508;width:100%;}
  .btn-gold:hover{opacity:.9;}
  .btn-ghost{background:transparent;color:var(--text-dim);border:1px solid var(--border);}
  .btn-ghost:hover{color:var(--text);border-color:var(--text-dim);}
  .btn-danger{background:transparent;color:var(--danger);border:1px solid rgba(229,72,77,.4);}
  .btn-danger:hover{background:rgba(229,72,77,.1);}
  .error-msg{color:var(--danger);font-size:13px;margin-top:10px;min-height:16px;}

  /* ---------- App shell ---------- */
  #app{display:none;min-height:100vh;}
  header.topbar{position:sticky;top:0;z-index:10;background:var(--surface);border-bottom:1px solid var(--border);
    padding:14px 24px;display:flex;align-items:center;justify-content:space-between;}
  .topbar .brand{color:var(--gold);font-weight:700;font-size:19px;}
  .topbar .user-info{display:flex;align-items:center;gap:14px;color:var(--text-dim);font-size:13px;}

  main{max-width:1100px;margin:0 auto;padding:24px;}
  .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:20px;}
  .toolbar-filters{display:flex;gap:8px;flex-wrap:wrap;flex:1;}
  .toolbar-filters input, .toolbar-filters select{width:auto;min-width:150px;}

  .stat-strip{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap;}
  .stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 18px;flex:1;min-width:120px;}
  .stat .num{font-size:22px;font-weight:700;color:var(--gold);}
  .stat .lbl{font-size:12px;color:var(--text-dim);}

  .news-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;}
  .news-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;}
  .news-card .thumb{width:100%;aspect-ratio:16/9;background:var(--surface-2) center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:var(--text-dim);font-size:12px;}
  .news-card .body{padding:14px;flex:1;display:flex;flex-direction:column;gap:8px;}
  .news-card h3{margin:0;font-size:15px;line-height:1.5;}
  .badges{display:flex;gap:6px;flex-wrap:wrap;}
  .badge{font-size:11px;padding:3px 9px;border-radius:20px;font-weight:600;}
  .badge-cat{background:var(--surface-2);color:var(--text-dim);}
  .badge-breaking{background:rgba(229,72,77,.15);color:var(--danger);}
  .badge-featured{background:rgba(212,162,78,.15);color:var(--gold);}
  .meta-row{font-size:12px;color:var(--text-dim);display:flex;justify-content:space-between;margin-top:auto;}
  .card-actions{display:flex;gap:8px;padding:0 14px 14px;}
  .card-actions .btn{flex:1;padding:8px;font-size:13px;}

  .empty-state{text-align:center;padding:60px 20px;color:var(--text-dim);}
  .empty-state h3{color:var(--text);margin-bottom:6px;}

  /* ---------- Modal ---------- */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-start;justify-content:center;
    padding:30px 16px;overflow-y:auto;z-index:50;}
  .overlay.show{display:flex;}
  .modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);width:100%;max-width:640px;padding:26px;}
  .modal h2{margin:0 0 20px;font-size:19px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .cat-row{display:flex;gap:8px;}
  .cat-row select{flex:2;}
  .cat-row input{flex:1;}
  textarea{resize:vertical;min-height:70px;font-family:'Tajawal',sans-serif;}
  textarea#f-body{min-height:180px;}
  .toggle-row{display:flex;gap:20px;margin:16px 0;}
  .toggle{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-dim);cursor:pointer;}
  .toggle input{width:16px;height:16px;accent-color:var(--gold);cursor:pointer;}
  .img-preview{width:100%;aspect-ratio:16/9;border-radius:8px;background:var(--surface-2) center/cover no-repeat;
    display:flex;align-items:center;justify-content:center;color:var(--text-dim);font-size:12px;margin-top:8px;border:1px dashed var(--border);}
  .modal-actions{display:flex;gap:10px;justify-content:flex-start;margin-top:22px;}
  .field small{color:var(--text-dim);font-size:11px;}

  /* ---------- Toast ---------- */
  #toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--surface);
    border:1px solid var(--border);border-radius:8px;padding:12px 20px;font-size:14px;opacity:0;pointer-events:none;
    transition:opacity .2s, transform .2s;z-index:100;}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  #toast.success{border-color:var(--success);color:var(--success);}
  #toast.error{border-color:var(--danger);color:var(--danger);}

  @media(max-width:600px){.row2{grid-template-columns:1fr;} .toolbar{flex-direction:column;align-items:stretch;}}
</style>
</head>
<body>

<!-- ============== شاشة تسجيل الدخول ============== -->
<div id="login-screen">
  <div class="login-card">
    <div class="brand">عراق دوت</div>
    <div class="brand-sub">لوحة التحكم — IRAQdot Admin</div>
    <div class="field">
      <label>البريد الإلكتروني</label>
      <input type="email" id="login-email" placeholder="admin@example.com">
    </div>
    <div class="field">
      <label>كلمة المرور</label>
      <input type="password" id="login-password" placeholder="••••••••">
    </div>
    <button class="btn btn-gold" id="login-btn">تسجيل الدخول</button>
    <div class="error-msg" id="login-error"></div>
  </div>
</div>

<!-- ============== التطبيق بعد تسجيل الدخول ============== -->
<div id="app">
  <header class="topbar">
    <div class="brand">عراق دوت — لوحة التحكم</div>
    <div class="user-info">
      <span id="user-email"></span>
      <button class="btn btn-ghost" id="logout-btn">تسجيل الخروج</button>
    </div>
  </header>

  <main>
    <div class="stat-strip">
      <div class="stat"><div class="num" id="stat-total">0</div><div class="lbl">إجمالي الأخبار</div></div>
      <div class="stat"><div class="num" id="stat-breaking">0</div><div class="lbl">أخبار عاجلة</div></div>
      <div class="stat"><div class="num" id="stat-featured">0</div><div class="lbl">أخبار مميّزة</div></div>
    </div>

    <div class="toolbar">
      <div class="toolbar-filters">
        <input type="text" id="search-input" placeholder="ابحث عن خبر...">
        <select id="filter-category"><option value="">كل الأقسام</option></select>
      </div>
      <button class="btn btn-gold" id="new-btn">+ إضافة خبر جديد</button>
    </div>

    <div class="news-grid" id="news-grid"></div>
    <div class="empty-state" id="empty-state" style="display:none;">
      <h3>لا توجد أخبار بعد</h3>
      <p>اضغط "إضافة خبر جديد" لنشر أول خبر.</p>
    </div>
  </main>
</div>

<!-- ============== نافذة إضافة / تعديل خبر ============== -->
<div class="overlay" id="modal-overlay">
  <div class="modal">
    <h2 id="modal-title">إضافة خبر جديد</h2>
    <input type="hidden" id="f-id">

    <div class="field">
      <label>عنوان الخبر *</label>
      <input type="text" id="f-title" placeholder="اكتب عنوان الخبر">
    </div>

    <div class="field">
      <label>الوصف القصير (يظهر تحت العنوان)</label>
      <textarea id="f-excerpt" placeholder="جملة أو جملتين تلخّص الخبر" style="min-height:50px;"></textarea>
    </div>

    <div class="row2">
      <div class="field">
        <label>القسم *</label>
        <div class="cat-row">
          <select id="f-category"></select>
          <input type="text" id="f-new-category" placeholder="قسم جديد">
        </div>
        <small>اكتب اسم قسم جديد بالحقل الصغير ثم اضغط "إضافة قسم" تحته إذا لزم.</small>
        <div style="margin-top:6px;"><button type="button" class="btn btn-ghost" id="add-category-btn" style="padding:6px 12px;font-size:12px;">+ إضافة قسم</button></div>
      </div>
      <div class="field">
        <label>الكاتب</label>
        <input type="text" id="f-author" placeholder="اسم الكاتب (اختياري)">
      </div>
    </div>

    <div class="field">
      <label>صورة الخبر</label>
      <input type="file" id="f-image-file" accept="image/*">
      <div class="img-preview" id="f-image-preview">لا توجد صورة</div>
    </div>

    <div class="field" style="margin-top:14px;">
      <label>تاريخ النشر</label>
      <input type="datetime-local" id="f-date">
    </div>

    <div class="field" style="margin-top:14px;">
      <label>محتوى الخبر *</label>
      <textarea id="f-body" placeholder="اكتب تفاصيل الخبر هنا..."></textarea>
    </div>

    <div class="toggle-row">
      <label class="toggle"><input type="checkbox" id="f-breaking"> خبر عاجل</label>
      <label class="toggle"><input type="checkbox" id="f-featured"> خبر مميّز / مثبت</label>
    </div>

    <div class="modal-actions">
      <button class="btn btn-gold" id="save-btn">حفظ الخبر</button>
      <button class="btn btn-ghost" id="cancel-btn">إلغاء</button>
      <button class="btn btn-danger" id="delete-btn" style="display:none;margin-right:auto;">حذف الخبر</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
/* ========================================================
   إعدادات Supabase — عبّي هذي القيم من: Project Settings → API
   ======================================================== */
const SUPABASE_URL = "https://curjpcwsfembsvlcdmyd.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_tCD65z3J7z_g_vzp8B-pSA_rROB0OXg";
const IMAGE_BUCKET = "news-images";

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let allNews = [];
let categories = [];
let editingId = null;
let pendingImageFile = null;

const $ = (id) => document.getElementById(id);

function showToast(msg, type = "success") {
  const t = $("toast");
  t.textContent = msg;
  t.className = "show " + type;
  setTimeout(() => (t.className = ""), 2800);
}

/* ---------------- تسجيل الدخول ---------------- */
$("login-btn").addEventListener("click", login);
$("login-password").addEventListener("keydown", (e) => { if (e.key === "Enter") login(); });

async function login() {
  $("login-error").textContent = "";
  const email = $("login-email").value.trim();
  const password = $("login-password").value;
  if (!email || !password) { $("login-error").textContent = "أدخل البريد وكلمة المرور."; return; }
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if (error) { $("login-error").textContent = "بيانات الدخول غير صحيحة."; return; }
  enterApp(data.user);
}

$("logout-btn").addEventListener("click", async () => {
  await sb.auth.signOut();
  location.reload();
});

async function enterApp(user) {
  $("login-screen").style.display = "none";
  $("app").style.display = "block";
  $("user-email").textContent = user.email;
  await loadCategories();
  await loadNews();
}

/* ---------------- تحميل البيانات ---------------- */
async function loadCategories() {
  const { data, error } = await sb.from("categories").select("*").order("name");
  if (error) { showToast("تعذّر تحميل الأقسام", "error"); return; }
  categories = data || [];
  const filterSel = $("filter-category");
  const formSel = $("f-category");
  filterSel.innerHTML = '<option value="">كل الأقسام</option>';
  formSel.innerHTML = "";
  categories.forEach((c) => {
    filterSel.innerHTML += `<option value="${c.name}">${c.name}</option>`;
    formSel.innerHTML += `<option value="${c.name}">${c.name}</option>`;
  });
}

async function loadNews() {
  const { data, error } = await sb.from("news").select("*").order("published_at", { ascending: false });
  if (error) { showToast("تعذّر تحميل الأخبار", "error"); return; }
  allNews = data || [];
  renderNews();
}

/* ---------------- عرض الأخبار ---------------- */
function renderNews() {
  const search = $("search-input").value.trim().toLowerCase();
  const catFilter = $("filter-category").value;
  const filtered = allNews.filter((n) => {
    const matchSearch = !search || n.title.toLowerCase().includes(search);
    const matchCat = !catFilter || n.category === catFilter;
    return matchSearch && matchCat;
  });

  $("stat-total").textContent = allNews.length;
  $("stat-breaking").textContent = allNews.filter((n) => n.is_breaking).length;
  $("stat-featured").textContent = allNews.filter((n) => n.is_featured).length;

  const grid = $("news-grid");
  grid.innerHTML = "";
  $("empty-state").style.display = filtered.length ? "none" : "block";

  filtered.forEach((n) => {
    const card = document.createElement("div");
    card.className = "news-card";
    const dateStr = new Date(n.published_at).toLocaleDateString("ar-IQ", { year: "numeric", month: "short", day: "numeric" });
    card.innerHTML = `
      <div class="thumb" style="${n.image_url ? `background-image:url('${n.image_url}')` : ""}">${n.image_url ? "" : "لا توجد صورة"}</div>
      <div class="body">
        <div class="badges">
          <span class="badge badge-cat">${n.category}</span>
          ${n.is_breaking ? '<span class="badge badge-breaking">عاجل</span>' : ""}
          ${n.is_featured ? '<span class="badge badge-featured">مميّز</span>' : ""}
        </div>
        <h3>${n.title}</h3>
        <div class="meta-row"><span>${n.author || "بدون كاتب"}</span><span>${dateStr}</span></div>
      </div>
      <div class="card-actions">
        <button class="btn btn-ghost edit-btn">تعديل</button>
      </div>
    `;
    card.querySelector(".edit-btn").addEventListener("click", () => openModal(n));
    grid.appendChild(card);
  });
}

$("search-input").addEventListener("input", renderNews);
$("filter-category").addEventListener("change", renderNews);

/* ---------------- إدارة الأقسام ---------------- */
$("add-category-btn").addEventListener("click", async () => {
  const name = $("f-new-category").value.trim();
  if (!name) return;
  const { error } = await sb.from("categories").insert({ name });
  if (error) { showToast("تعذّر إضافة القسم (ربما موجود مسبقاً)", "error"); return; }
  $("f-new-category").value = "";
  await loadCategories();
  $("f-category").value = name;
  showToast("تمت إضافة القسم");
});

/* ---------------- نافذة الإضافة / التعديل ---------------- */
$("new-btn").addEventListener("click", () => openModal(null));
$("cancel-btn").addEventListener("click", closeModal);
$("modal-overlay").addEventListener("click", (e) => { if (e.target.id === "modal-overlay") closeModal(); });

function openModal(news) {
  editingId = news ? news.id : null;
  pendingImageFile = null;
  $("modal-title").textContent = news ? "تعديل الخبر" : "إضافة خبر جديد";
  $("f-id").value = news ? news.id : "";
  $("f-title").value = news ? news.title : "";
  $("f-excerpt").value = news ? news.excerpt || "" : "";
  $("f-category").value = news ? news.category : (categories[0] ? categories[0].name : "");
  $("f-author").value = news ? news.author || "" : "";
  $("f-body").value = news ? news.body : "";
  $("f-breaking").checked = news ? news.is_breaking : false;
  $("f-featured").checked = news ? news.is_featured : false;
  $("f-image-file").value = "";
  $("f-image-preview").style.backgroundImage = news && news.image_url ? `url('${news.image_url}')` : "";
  $("f-image-preview").textContent = news && news.image_url ? "" : "لا توجد صورة";
  $("f-image-preview").dataset.existingUrl = news && news.image_url ? news.image_url : "";

  const d = news ? new Date(news.published_at) : new Date();
  $("f-date").value = new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16);

  $("delete-btn").style.display = news ? "block" : "none";
  $("modal-overlay").classList.add("show");
}

function closeModal() {
  $("modal-overlay").classList.remove("show");
}

$("f-image-file").addEventListener("change", (e) => {
  const file = e.target.files[0];
  if (!file) return;
  pendingImageFile = file;
  const reader = new FileReader();
  reader.onload = (ev) => {
    $("f-image-preview").style.backgroundImage = `url('${ev.target.result}')`;
    $("f-image-preview").textContent = "";
  };
  reader.readAsDataURL(file);
});

/* ---------------- حفظ الخبر ---------------- */
$("save-btn").addEventListener("click", saveNews);

async function saveNews() {
  const title = $("f-title").value.trim();
  const body = $("f-body").value.trim();
  const category = $("f-category").value;
  if (!title || !body || !category) { showToast("عبّي العنوان والمحتوى والقسم على الأقل", "error"); return; }

  $("save-btn").disabled = true;
  $("save-btn").textContent = "جارِ الحفظ...";

  let imageUrl = $("f-image-preview").dataset.existingUrl || null;

  if (pendingImageFile) {
    const ext = pendingImageFile.name.split(".").pop();
    const path = `${Date.now()}-${Math.random().toString(36).slice(2)}.${ext}`;
    const { error: upErr } = await sb.storage.from(IMAGE_BUCKET).upload(path, pendingImageFile);
    if (upErr) {
      showToast("فشل رفع الصورة: " + upErr.message, "error");
      $("save-btn").disabled = false; $("save-btn").textContent = "حفظ الخبر";
      return;
    }
    const { data: pub } = sb.storage.from(IMAGE_BUCKET).getPublicUrl(path);
    imageUrl = pub.publicUrl;
  }

  const payload = {
    title,
    excerpt: $("f-excerpt").value.trim(),
    category,
    author: $("f-author").value.trim(),
    body,
    image_url: imageUrl,
    is_breaking: $("f-breaking").checked,
    is_featured: $("f-featured").checked,
    published_at: new Date($("f-date").value).toISOString(),
  };

  let error;
  if (editingId) {
    ({ error } = await sb.from("news").update(payload).eq("id", editingId));
  } else {
    ({ error } = await sb.from("news").insert(payload));
  }

  $("save-btn").disabled = false;
  $("save-btn").textContent = "حفظ الخبر";

  if (error) { showToast("خطأ بالحفظ: " + error.message, "error"); return; }
  showToast(editingId ? "تم تحديث الخبر" : "تم نشر الخبر");
  closeModal();
  loadNews();
}

/* ---------------- حذف الخبر ---------------- */
$("delete-btn").addEventListener("click", async () => {
  if (!editingId) return;
  if (!confirm("متأكد تريد حذف هذا الخبر؟ لا يمكن التراجع.")) return;
  const { error } = await sb.from("news").delete().eq("id", editingId);
  if (error) { showToast("تعذّر الحذف", "error"); return; }
  showToast("تم حذف الخبر");
  closeModal();
  loadNews();
});

/* ---------------- تحقق من الجلسة عند فتح الصفحة ---------------- */
(async function init() {
  const { data: { session } } = await sb.auth.getSession();
  if (session) enterApp(session.user);
})();
</script>
</body>
</html>
